#     listen 443 ssl;
#     server_name kshome.sckje.com;
#
#     ssl_certificate     /etc/letsencrypt/live/kshome.sckje.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/kshome.sckje.com/privkey.pem;
#     include             /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam         /etc/letsencrypt/options-ssl-nginx.conf;
#
#     # 其余 location 块（/gomoku/、/gomoku/api/、/gomoku/ws/）原样复制
#     # 注意：若站点走 HTTPS，前端 VITE_BASE 需改为 https://kshome.sckje.com/gomoku
#     #       这样 WebSocket 才会用 wss:// 而非 ws://，否则浏览器会因混合内容报错。
# }
