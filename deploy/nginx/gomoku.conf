# =============================================================================
# 五子棋 gomoku —— nginx 站点配置
# =============================================================================
# 拓扑：
#   访问入口      : http://kshome.sckje.com/gomoku/
#   前端静态资源  : 由本机 nginx 直接托管（构建出的 dist 目录）
#   后端 REST API : /gomoku/api/**  ->  192.168.1.120:9000/api/**
#   后端 WebSocket: /gomoku/ws/**   ->  192.168.1.120:9000/ws/**  (需 Upgrade)
#
# 部署步骤：
#   1) 把前端构建产物拷到本机：  cp -r gomoku-web/dist/.  /srv/www/gomoku/
#      （dist 里的 index.html 引用 /gomoku/assets/...，nginx 会映射到
#         /srv/www/gomoku/assets/...，路径完全吻合）
#   2) 把本文件软链到 nginx 启用目录，例如：
#        ln -s /path/to/gomoku.conf /etc/nginx/conf.d/gomoku.conf
#   3) nginx -t && systemctl reload nginx
#
# 说明：前端与后端经同一域名+同一 /gomoku 前缀，浏览器视为同源，
#       因此无需在 nginx 层额外配置 CORS（后端已加的 CORS 头可保留、无害）。
# =============================================================================

# 后端上游（只改这里即可换地址 / 加多实例）
upstream gomoku_backend {
    server 192.168.1.120:9000;
    # 多实例示例（需后端自身支持，当前为单实例内存态，勿开多副本）：
    # server 192.168.1.121:9000;
}

server {
    listen 80;
    server_name kshome.sckje.com;

    # 上传/请求体大小（棋盘消息很小，给个保守上限即可）
    client_max_body_size 8m;

    # -------------------------------------------------------------------------
    # 1) 带 hash 的静态资源：长缓存（文件名带内容摘要，可放心 immutable）
    # -------------------------------------------------------------------------
    location ~* ^/gomoku/assets/.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        root /srv/www;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # 2) 前端页面：托管 dist 目录，SPA 兜底到 index.html
    #    /srv/www/gomoku/index.html  ->  浏览器访问 /gomoku/
    #    /srv/www/gomoku/assets/...  ->  /gomoku/assets/...
    # -------------------------------------------------------------------------
    location /gomoku/ {
        root /srv/www;
        index index.html;
        try_files $uri $uri/ /gomoku/index.html;
    }

    # -------------------------------------------------------------------------
    # 3) 后端 REST API：剥掉 /gomoku 前缀，转发到后端 /api/
    #    /gomoku/api/rooms  ->  192.168.1.120:9000/api/rooms
    # -------------------------------------------------------------------------
    location /gomoku/api/ {
        proxy_pass http://gomoku_backend/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;
    }

    # -------------------------------------------------------------------------
    # 4) 后端 WebSocket：必须带 Upgrade / Connection 头
    #    /gomoku/ws/game  ->  192.168.1.120:9000/ws/game
    # -------------------------------------------------------------------------
    location /gomoku/ws/ {
        proxy_pass http://gomoku_backend/ws/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接，超时设长一些，避免对局中途被断
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # -------------------------------------------------------------------------
    # 5) 访问根路径 / 时跳到 /gomoku/（可选，方便直接输入域名进游戏）
    # -------------------------------------------------------------------------
    location = / {
        return 302 /gomoku/;
    }
}

# =============================================================================
# （可选）启用 HTTPS：把上面 server 块复制一份，改成下面这样，并删掉上面的 80 端口块
#   或保留 80 端口块仅做 301 跳转。证书用 certbot 申请：
#   sudo certbot --nginx -d kshome.sckje.com
